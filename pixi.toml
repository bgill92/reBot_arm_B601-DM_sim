[workspace]
name = "reBot_arm_B601-DM_sim"
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12.8", glibc = "2.35" }]

[activation.env]
# Prevent the interpreter from picking up ~/.local/lib/pythonX.Y/site-packages,
# which can shadow this env's cmeel-based packages (pinocchio, coal) with an
# incompatible user install of the same package names.
PYTHONNOUSERSITE = "1"

[dependencies]
python = "3.12.*"
# lerobot 0.6.1 requires torch<2.12.
pytorch-gpu = ">=2.7,<2.12"
# No explicit version: relies on conda-forge run-exports to pull the torchvision
# build matching the pinned pytorch-gpu version.
torchvision = "*"
cuda-version = ">=12.8"
# lerobot 0.6.1 requires numpy<2.3.
numpy = "<2.3"
ffmpeg = "*"
pytest = "*"
# lerobot 0.6.1 requires packaging<26.0; without this pin the conda solve
# picks a newer packaging that conflicts with lerobot's pypi requirement.
packaging = ">=24.2,<26.0"
# genesis-world depends on moviepy, which requires pillow<12.0; without this
# pin the conda solve picks a newer pillow that conflicts with that chain.
pillow = ">=9.2.0,<12.0"
# lerobot[dataset] depends on datasets, which caps fsspec; without this pin
# the conda solve picks a newer fsspec that conflicts with that upper bound.
fsspec = ">=2023.1.0,<2026.3.0"

[pypi-dependencies]
genesis-world = ">=1.3.3"
pyroboplan = ">=1.3.1"
gymnasium = ">=1.1.1"
# Capped below 0.7: lerobot is a fast-moving pre-1.0 API.
lerobot = { version = ">=0.6.1,<0.7", extras = ["smolvla", "dataset"] }

[tasks]
test = "pytest -x -q tests"
sim = "python sim.py"
collect = "python scripts/collect.py"
